[project]
name = "comfyui-moss-image-afm"
version = "0.1.1"
description = "Attention Frequency Modulation for native ComfyUI MOSS-Image"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: opt-in live ComfyUI inference"]

[tool.ruff]
line-length = 100
target-version = "py312"
